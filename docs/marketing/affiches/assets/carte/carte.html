<!doctype html><html><head><meta charset="utf-8"><style>/*
 * ScanLinkPay card — ISO/IEC 7810 ID-1 (85.60 x 53.98 mm, corner radius 3.18 mm).
 * Every size is a multiple of --u = 1 mm of the card: the parent sets it (1mm in print, width/85.6 in px on screen), so the
 * same card is faithful at any size. (Not `em`: an element that sets its own font-size would also rescale its position.) Poppins weights 400-800 are bundled by main.tsx.
 */
.slp-card { --b: 0px; position: relative; width: calc(calc(85.6 * var(--u)) + 2 * var(--b)); height: calc(calc(53.98 * var(--u)) + 2 * var(--b)); border-radius: calc(3.18 * var(--u)); overflow: hidden; color: #fff; font-family: Poppins, system-ui, sans-serif; line-height: 1.2; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.slp-card.has-bleed { border-radius: 0; }
.slp-card.front { background: radial-gradient(120% 90% at 85% 0%, rgba(90,150,255,.55) 0%, rgba(90,150,255,0) 55%), linear-gradient(135deg, #1a3cff 0%, #0f26d8 55%, #0a17a8 100%); }
.slp-card.back { background: linear-gradient(135deg, #1530e8 0%, #0f26d8 55%, #0a17a8 100%); }
.slp-inner { position: absolute; left: var(--b); top: var(--b); width: calc(85.6 * var(--u)); height: calc(53.98 * var(--u)); }
.slp-card .abs { position: absolute; }
.slp-card .grat { position: absolute; left: calc(-1 * var(--b)); top: calc(-1 * var(--b)); width: calc(100% + 2 * var(--b)); height: calc(100% + 2 * var(--b)); pointer-events: none; }
.slp-card .wave { position: absolute; left: calc(-1 * var(--b)); bottom: calc(-1 * var(--b)); width: calc(100% + 2 * var(--b)); height: calc(calc(20 * var(--u)) + var(--b)); }
.slp-card .map { position: absolute; pointer-events: none; }
.slp-card.front .map { left: calc(27 * var(--u)); top: calc(-1.5 * var(--u)); width: calc(57 * var(--u)); height: calc(57 * var(--u)); }
.slp-card.back .map { left: calc(46 * var(--u)); top: calc(16 * var(--u)); width: calc(38 * var(--u)); height: calc(38 * var(--u)); }
.slp-card.back .map .flag { display: none; }

.slp-card .brand { left: calc(4.5 * var(--u)); top: calc(5 * var(--u)); }
.slp-card .word { font-weight: 800; font-size: calc(4.94 * var(--u)); line-height: 1; letter-spacing: calc(-.07 * var(--u)); }
.slp-card .word b { color: #38b6ff; font-weight: 800; }
.slp-card .slogan { font-size: calc(1.27 * var(--u)); letter-spacing: calc(.32 * var(--u)); font-weight: 600; color: #b9c6ff; margin-top: calc(1.1 * var(--u)); white-space: nowrap; }
.slp-card .pill { right: calc(4.5 * var(--u)); top: calc(4.8 * var(--u)); font-size: calc(1.76 * var(--u)); font-weight: 700; letter-spacing: calc(.28 * var(--u)); padding: calc(.5 * var(--u)) calc(1.25 * var(--u)); border: calc(.2 * var(--u)) solid rgba(255,255,255,.55); border-radius: calc(3 * var(--u)); background: rgba(255,255,255,.1); line-height: 1.5; }
.slp-card .hint { left: calc(4.5 * var(--u)); top: calc(17.5 * var(--u)); width: calc(50 * var(--u)); }
.slp-card .hint .t { font-size: calc(2.82 * var(--u)); font-weight: 700; line-height: 1.15; }
.slp-card .hint .s { font-size: calc(1.83 * var(--u)); color: #cdd7ff; margin-top: calc(.55 * var(--u)); line-height: 1.35; }
.slp-card .qr { right: calc(4.5 * var(--u)); top: calc(14.2 * var(--u)); width: calc(21.5 * var(--u)); height: calc(21.5 * var(--u)); }
.slp-card .qr .tile { position: absolute; inset: 0; background: #fff; border-radius: calc(1.8 * var(--u)); padding: calc(2.2 * var(--u)); }
.slp-card .qr .tile svg, .slp-card .qr .tile img { width: 100%; height: 100%; display: block; }
.slp-card .qr i { position: absolute; width: calc(3.2 * var(--u)); height: calc(3.2 * var(--u)); border: calc(.55 * var(--u)) solid #38b6ff; }
.slp-card .qr i:nth-of-type(1) { left: calc(-1.1 * var(--u)); top: calc(-1.1 * var(--u)); border-right: 0; border-bottom: 0; border-radius: calc(1.2 * var(--u)) 0 0 0; }
.slp-card .qr i:nth-of-type(2) { right: calc(-1.1 * var(--u)); top: calc(-1.1 * var(--u)); border-left: 0; border-bottom: 0; border-radius: 0 calc(1.2 * var(--u)) 0 0; }
.slp-card .qr i:nth-of-type(3) { left: calc(-1.1 * var(--u)); bottom: calc(-1.1 * var(--u)); border-right: 0; border-top: 0; border-radius: 0 0 0 calc(1.2 * var(--u)); }
.slp-card .qr i:nth-of-type(4) { right: calc(-1.1 * var(--u)); bottom: calc(-1.1 * var(--u)); border-left: 0; border-top: 0; border-radius: 0 0 calc(1.2 * var(--u)) 0; }
.slp-card .qr.none .tile { display: flex; align-items: center; justify-content: center; text-align: center; font-size: calc(1.7 * var(--u)); color: #3a4a99; font-weight: 600; }
.slp-card .num { left: calc(4.5 * var(--u)); top: calc(36.4 * var(--u)); font-size: calc(4.3 * var(--u)); font-weight: 600; letter-spacing: calc(.44 * var(--u)); font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 calc(.06 * var(--u)) 0 rgba(0,10,90,.55), 0 calc(-.025 * var(--u)) 0 rgba(255,255,255,.35); }
.slp-card .lbl { font-size: calc(1.27 * var(--u)); letter-spacing: calc(.25 * var(--u)); font-weight: 600; color: #b9c6ff; text-transform: uppercase; white-space: nowrap; }
.slp-card .val { font-size: calc(2.61 * var(--u)); font-weight: 600; letter-spacing: calc(.25 * var(--u)); text-transform: uppercase; margin-top: calc(.2 * var(--u)); white-space: nowrap; }
.slp-card .holder { left: calc(4.5 * var(--u)); bottom: calc(3.6 * var(--u)); }
.slp-card .valid { left: calc(50 * var(--u)); bottom: calc(3.6 * var(--u)); }
.slp-card .logo-br { right: calc(4.5 * var(--u)); bottom: calc(3.6 * var(--u)); width: calc(10.5 * var(--u)); height: calc(10.5 * var(--u)); }
.slp-card .logo-br img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 calc(.3 * var(--u)) calc(.6 * var(--u)) rgba(0,10,100,.5)); }

.slp-card .hot { top: calc(2.3 * var(--u)); font-size: calc(1.38 * var(--u)); font-weight: 600; letter-spacing: calc(.07 * var(--u)); color: #dfe6ff; white-space: nowrap; }
.slp-card .stripe { left: calc(-1 * var(--b)); right: calc(-1 * var(--b)); top: calc(5.54 * var(--u)); height: calc(10.28 * var(--u)); background: linear-gradient(#0b0f2e, #05071a 50%, #0b0f2e); }
.slp-card .siglabel { left: calc(4.5 * var(--u)); top: calc(16.5 * var(--u)); font-size: calc(1.27 * var(--u)); letter-spacing: calc(.21 * var(--u)); font-weight: 600; color: #dfe6ff; white-space: nowrap; }
.slp-card .sig { left: calc(4.5 * var(--u)); top: calc(19 * var(--u)); width: calc(55.5 * var(--u)); height: calc(8 * var(--u)); background: #fff; border-radius: calc(.6 * var(--u)); overflow: hidden; }
.slp-card .sig:before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #dbe5ff 0 calc(.35 * var(--u)), #fff calc(.35 * var(--u)) calc(1.3 * var(--u))); }
.slp-card .sig em { position: absolute; right: calc(1.6 * var(--u)); bottom: calc(.9 * var(--u)); font-style: normal; font-size: calc(2.26 * var(--u)); font-weight: 600; color: #1b2a7a; letter-spacing: calc(.28 * var(--u)); }
.slp-card .terms { left: calc(4.5 * var(--u)); top: calc(30.2 * var(--u)); width: calc(70 * var(--u)); font-size: calc(1.62 * var(--u)); line-height: 1.5; color: #d6deff; }
.slp-card .terms b { color: #fff; font-weight: 700; }
.slp-card .band { left: calc(4.5 * var(--u)); right: calc(4.5 * var(--u)); bottom: calc(3.6 * var(--u)); height: calc(9.6 * var(--u)); border-radius: calc(1.4 * var(--u)); background: rgba(255,255,255,.14); border: calc(.15 * var(--u)) solid rgba(255,255,255,.28); display: flex; align-items: center; justify-content: space-between; gap: calc(1.6 * var(--u)); padding: 0 calc(1.6 * var(--u)); }
.slp-card .band .k { font-size: calc(1.27 * var(--u)); letter-spacing: calc(.21 * var(--u)); font-weight: 600; color: #cdd7ff; text-transform: uppercase; white-space: nowrap; }
.slp-card .band .ps { display: flex; gap: calc(2.2 * var(--u)); }
.slp-card .band .p { height: calc(7.2 * var(--u)); width: calc(7.2 * var(--u)); border-radius: calc(1.3 * var(--u)); display: block; object-fit: cover; box-shadow: 0 calc(.2 * var(--u)) calc(.6 * var(--u)) rgba(0,10,100,.35); background: #fff; }

/* Print view: one card face per page, at its real size. */
@media print {
  @page { margin: 0; }
  .slp-print-hide { display: none !important; }
  .slp-print-page { break-after: page; page-break-after: always; }
  body { background: #fff !important; }
}
.slp-print-only { display: none; }
@media print { .slp-print-only { display: block; } .slp-card { box-shadow: none !important; } }
